name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify workspace
        run: npm run verify
      - name: Validate database configuration
        if: runner.os == 'Linux'
        env:
          POSTGRES_PASSWORD: ci-local-database-only
        run: |
          docker compose config --quiet
          docker compose up -d --wait postgres
          docker compose exec -T -e PGPASSWORD="$POSTGRES_PASSWORD" postgres psql -h 127.0.0.1 -U chess_room -d chess_room -c "SELECT version();"
      - name: Stop local database
        if: always() && runner.os == 'Linux'
        env:
          POSTGRES_PASSWORD: ci-local-database-only
        run: docker compose down
