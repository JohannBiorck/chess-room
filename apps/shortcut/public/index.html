<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#183e31" />
    <title>Cat Chess</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #183e31;
        background: #fbf5e9;
      }
      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        place-items: center;
      }
      main {
        max-width: 30rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: clamp(2rem, 8vw, 3rem);
        margin: 0 0 1rem;
      }
      p {
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.8rem 1.3rem;
        border-radius: 0.6rem;
        color: #ffffff;
        background: #183e31;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #a34c15;
        outline-offset: 4px;
      }
    </style>
    <script type="module" src="/redirect.js"></script>
  </head>
  <body>
    <main>
      <h1>Cat Chess</h1>
      <p id="redirect-status" role="status">Taking you to the board…</p>
      <a id="continue-link" href="https://chess-room-c09w.onrender.com/">Continue to Cat Chess</a>
      <noscript><p>Use the link to continue.</p></noscript>
    </main>
  </body>
</html>
