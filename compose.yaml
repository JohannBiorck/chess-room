name: chess-room
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: chess_room_admin
      POSTGRES_DB: chess_room
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in your local .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/database/001-application-role.sh:/docker-entrypoint-initdb.d/001-application-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess_room -d chess_room"]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 30s
volumes:
  postgres-data:
